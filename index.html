<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <!-- Font Awesome for icons (optional but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
      padding: 2rem 2rem 2.5rem;
      transition: all 0.2s;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b2b4b;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.2rem;
    }

    h1 i {
      background: #0b2b4b;
      color: white;
      padding: 0.6rem;
      border-radius: 50%;
      font-size: 1.2rem;
      width: 2.8rem;
      height: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subhead {
      color: #5c6f87;
      margin-bottom: 2rem;
      font-size: 1rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      font-weight: 400;
    }

    /* form card */
    .form-card {
      background: #f9fcff;
      border-radius: 1.5rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 2rem;
      border: 1px solid #d9e6f2;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }

    .input-group {
      flex: 1 1 180px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #305a7a;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .input-group label i {
      font-size: 0.8rem;
      color: #2c7be5;
    }

    .input-group input, 
    .input-group select {
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 1px solid #cbdae9;
      background: white;
      font-size: 0.95rem;
      transition: 0.15s;
      width: 100%;
      outline: none;
    }

    .input-group input:focus, 
    .input-group select:focus {
      border-color: #2c7be5;
      box-shadow: 0 0 0 3px rgba(44, 123, 229, 0.15);
    }

    .btn {
      background: #0b2b4b;
      color: white;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      box-shadow: 0 6px 12px -4px rgba(11, 43, 75, 0.3);
      height: 52px;
      align-self: flex-end;
    }

    .btn:hover {
      background: #1a3f63;
      transform: translateY(-1px);
      box-shadow: 0 10px 16px -6px #0b2b4b80;
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 8px -4px #0b2b4b;
    }

    .btn i {
      font-size: 0.9rem;
    }

    /* stats + filters row */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      gap: 1rem;
    }

    .stats {
      display: flex;
      gap: 1.2rem;
      background: #e9f0f9;
      padding: 0.6rem 1.6rem;
      border-radius: 4rem;
      font-weight: 500;
      color: #0b2b4b;
    }

    .stats span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stats i {
      color: #2c7be5;
    }

    .filter-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      border-radius: 3rem;
      border: 1px solid #d0dfee;
    }

    .filter-wrapper i {
      color: #6889a8;
      font-size: 0.9rem;
    }

    #statusFilter {
      border: none;
      background: transparent;
      padding: 0.5rem 0.8rem 0.5rem 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1f3a57;
      outline: none;
      cursor: pointer;
      border-radius: 2rem;
    }

    /* table */
    .table-responsive {
      overflow-x: auto;
      border-radius: 1.5rem;
      background: white;
      box-shadow: 0 6px 18px rgba(0, 20, 30, 0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
    }

    th {
      background: #edf4fc;
      padding: 1rem 1.2rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #1d4b74;
      border-bottom: 1px solid #c8d9eb;
    }

    td {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #e2ecf7;
      vertical-align: middle;
      color: #10324e;
      font-weight: 500;
      font-size: 0.95rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #f6faff;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.3px;
      width: fit-content;
    }

    .badge-applied {
      background: #dbeafe;
      color: #1e4a8b;
    }
    .badge-interview {
      background: #fef9c3;
      color: #856404;
    }
    .badge-offer {
      background: #dcfce7;
      color: #166534;
    }
    .badge-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.5rem 0.6rem;
      border-radius: 2rem;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4c6e8c;
      width: 2.3rem;
      height: 2.3rem;
    }

    .icon-btn:hover {
      background: #e4effb;
      color: #0b2b4b;
    }

    .icon-btn.delete-btn:hover {
      background: #ffe6e6;
      color: #b91c1c;
    }

    .empty-row td {
      padding: 3rem 1rem;
      text-align: center;
      color: #6f8da6;
      font-style: italic;
      font-weight: 400;
      font-size: 1rem;
    }

    .empty-row i {
      font-size: 1.8rem;
      margin-right: 0.6rem;
      color: #aac1d9;
      vertical-align: middle;
    }

    /* inline edit (simple) */
    .edit-input {
      padding: 0.5rem 0.7rem;
      border-radius: 0.8rem;
      border: 1px solid #2c7be5;
      font-size: 0.9rem;
      width: 100%;
      max-width: 170px;
      background: white;
    }

    /* small toast */
    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0b2b4b;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      font-weight: 500;
      box-shadow: 0 10px 25px -8px black;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1000;
      font-size: 0.95rem;
    }

    .toast-message.show {
      opacity: 1;
    }

    @media (max-width: 700px) {
      body { padding: 0.8rem; }
      .app-container { padding: 1.5rem; }
      h1 { font-size: 1.6rem; }
      .btn { width: 100%; justify-content: center; }
      .form-row { flex-direction: column; align-items: stretch; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .filter-wrapper { align-self: flex-start; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <h1>
    <i class="fas fa-briefcase"></i> 
    Job Application Tracker
  </h1>
  <div class="subhead">Track your applications, interviews, and offers in one place</div>

  <!-- add application form -->
  <div class="form-card">
    <div class="form-row">
      <div class="input-group">
        <label><i class="fas fa-building"></i> Company</label>
        <input type="text" id="companyInput" placeholder="e.g. Google" autocomplete="off">
      </div>
      <div class="input-group">
        <label><i class="fas fa-user-tie"></i> Position</label>
        <input type="text" id="positionInput" placeholder="e.g. Frontend Developer" autocomplete="off">
      </div>
      <div class="input-group">
        <label><i class="fas fa-calendar-alt"></i> Date Applied</label>
        <input type="date" id="dateInput">
      </div>
      <div class="input-group">
        <label><i class="fas fa-tag"></i> Status</label>
        <select id="statusInput">
          <option value="Applied">Applied</option>
          <option value="Interview">Interview</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
      <button class="btn" id="addBtn">
        <i class="fas fa-plus-circle"></i> Add Application
      </button>
    </div>
  </div>

  <!-- stats + filter -->
  <div class="toolbar">
    <div class="stats">
      <span><i class="fas fa-file-alt"></i> Total: <strong id="totalCount">0</strong></span>
      <span><i class="fas fa-hourglass-half"></i> Active: <strong id="activeCount">0</strong></span>
    </div>
    <div class="filter-wrapper">
      <i class="fas fa-filter"></i>
      <select id="statusFilter">
        <option value="All">All statuses</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>
  </div>

  <!-- applications table -->
  <div class="table-responsive">
    <table id="applicationsTable">
      <thead>
        <tr>
          <th>Company</th>
          <th>Position</th>
          <th>Date Applied</th>
          <th>Status</th>
          <th style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- dynamic rows will be inserted here -->
      </tbody>
    </table>
  </div>
</div>

<!-- small toast for feedback -->
<div id="toast" class="toast-message"></div>

<script>
  (function(){
    // ---------- state & storage ----------
    const STORAGE_KEY = 'job_application_tracker_v1';
    let applications = [];          // array of objects
    let editId = null;             // if editing a row, store id; else null

    // DOM elements
    const tableBody = document.getElementById('tableBody');
    const companyInput = document.getElementById('companyInput');
    const positionInput = document.getElementById('positionInput');
    const dateInput = document.getElementById('dateInput');
    const statusInput = document.getElementById('statusInput');
    const addBtn = document.getElementById('addBtn');
    const statusFilter = document.getElementById('statusFilter');
    const totalCountSpan = document.getElementById('totalCount');
    const activeCountSpan = document.getElementById('activeCount');
    const toastEl = document.getElementById('toast');

    // ---------- helpers ----------
    function generateId() {
      return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    }

    // format date for display (YYYY-MM-DD -> Mon DD, YYYY)
    function formatDisplayDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const [y, m, d] = dateStr.split('-');
        const date = new Date(y, m-1, d);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dateStr;
      }
    }

    // show temporary message
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2200);
    }

    // save to localStorage
    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
    }

    // load from localStorage
    function loadFromStorage() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          applications = JSON.parse(stored);
          // ensure each has an id (migration for older data)
          applications = applications.map(app => {
            if (!app.id) app.id = generateId();
            return app;
          });
        } catch (e) {
          applications = [];
        }
      } else {
        // seed with two sample applications (only if nothing in storage)
        applications = [
          { id: generateId(), company: 'Acme Corp', position: 'Frontend Developer', date: '2025-02-10', status: 'Interview' },
          { id: generateId(), company: 'Globex Inc', position: 'React Engineer', date: '2025-02-01', status: 'Applied' }
        ];
        saveToStorage();
      }
    }

    // update stats (total + active = Applied + Interview)
    function updateStats() {
      const total = applications.length;
      const active = applications.filter(app => app.status === 'Applied' || app.status === 'Interview').length;
      totalCountSpan.textContent = total;
      activeCountSpan.textContent = active;
    }

    // returns filtered applications based on statusFilter dropdown
    function getFilteredApplications() {
      const filter = statusFilter.value;
      if (filter === 'All') return applications;
      return applications.filter(app => app.status === filter);
    }

    // render table body based on current applications & filter
    function renderTable() {
      const filtered = getFilteredApplications();
      
      if (filtered.length === 0) {
        // show empty state
        const emptyMessage = applications.length === 0 
          ? 'No applications yet. Add your first job application!' 
          : 'No applications match this filter.';
        tableBody.innerHTML = `
          <tr class="empty-row">
            <td colspan="5">
              <i class="fas fa-inbox"></i> ${emptyMessage}
            </td>
          </tr>
        `;
        updateStats();
        return;
      }

      let html = '';
      // sort by date (newest first) but keep consistent
      const sorted = [...filtered].sort((a, b) => {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return b.date.localeCompare(a.date); // descending
      });

      sorted.forEach(app => {
        const isEditing = (editId === app.id);
        const statusClass = `badge-${app.status.toLowerCase()}`;
        const displayDate = formatDisplayDate(app.date);

        // if this row is being edited (only one at a time)
        if (isEditing) {
          html += `
            <tr data-id="${app.id}" class="editing-row">
              <td>
                <input type="text" class="edit-input" id="edit-company-${app.id}" value="${escapeHtml(app.company)}" placeholder="Company">
              </td>
              <td>
                <input type="text" class="edit-input" id="edit-position-${app.id}" value="${escapeHtml(app.position)}" placeholder="Position">
              </td>
              <td>
                <input type="date" class="edit-input" id="edit-date-${app.id}" value="${app.date || ''}">
              </td>
              <td>
                <select class="edit-input" id="edit-status-${app.id}">
                  <option value="Applied" ${app.status === 'Applied' ? 'selected' : ''}>Applied</option>
                  <option value="Interview" ${app.status === 'Interview' ? 'selected' : ''}>Interview</option>
                  <option value="Offer" ${app.status === 'Offer' ? 'selected' : ''}>Offer</option>
                  <option value="Rejected" ${app.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                </select>
              </td>
              <td>
                <div class="actions" style="justify-content: center;">
                  <button class="icon-btn save-btn" data-id="${app.id}" title="Save"><i class="fas fa-check-circle" style="color:#1e7e34;"></i></button>
                  <button class="icon-btn cancel-btn" data-id="${app.id}" title="Cancel"><i class="fas fa-times-circle" style="color:#b02a37;"></i></button>
                </div>
              </td>
            </tr>
          `;
        } else {
          html += `
            <tr data-id="${app.id}">
              <td><strong>${escapeHtml(app.company)}</strong></td>
              <td>${escapeHtml(app.position)}</td>
              <td>${displayDate}</td>
              <td><span class="badge ${statusClass}">${app.status}</span></td>
              <td>
                <div class="actions" style="justify-content: center;">
                  <button class="icon-btn edit-btn" data-id="${app.id}" title="Edit"><i class="fas fa-pen"></i></button>
                  <button class="icon-btn delete-btn" data-id="${app.id}" title="Delete"><i class="fas fa-trash-can"></i></button>
                </div>
              </td>
            </tr>
          `;
        }
      });

      tableBody.innerHTML = html;
      updateStats();
    }

    // simple escape to prevent XSS (basic)
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---------- event handlers ----------
    // add new application
    function handleAddApplication() {
      const company = companyInput.value.trim();
      const position = positionInput.value.trim();
      const date = dateInput.value;
      const status = statusInput.value;

      if (!company || !position) {
        showToast('Please enter company and position.');
        return;
      }

      const newApp = {
        id: generateId(),
        company,
        position,
        date: date || new Date().toISOString().slice(0,10), // default today if empty
        status
      };

      applications.push(newApp);
      saveToStorage();
      
      // clear inputs (keep date maybe)
      companyInput.value = '';
      positionInput.value = '';
      dateInput.value = '';
      // reset status to Applied
      statusInput.value = 'Applied';
      
      // cancel any editing
      editId = null;
      
      renderTable();
      showToast('Application added!');
      companyInput.focus();
    }

    // handle table clicks (edit, delete, save, cancel)
    function handleTableClick(e) {
      const target = e.target.closest('button');
      if (!target) return;
      
      const id = target.getAttribute('data-id');
      if (!id) return;

      // EDIT button
      if (target.classList.contains('edit-btn')) {
        e.preventDefault();
        editId = id;
        renderTable();
        return;
      }

      // DELETE button
      if (target.classList.contains('delete-btn')) {
        e.preventDefault();
        if (confirm('Delete this application?')) {
          applications = applications.filter(app => app.id !== id);
          if (editId === id) editId = null;
          saveToStorage();
          renderTable();
          showToast('Application deleted.');
        }
        return;
      }

      // SAVE button (inside edit mode)
      if (target.classList.contains('save-btn')) {
        e.preventDefault();
        const companyField = document.getElementById(`edit-company-${id}`);
        const positionField = document.getElementById(`edit-position-${id}`);
        const dateField = document.getElementById(`edit-date-${id}`);
        const statusField = document.getElementById(`edit-status-${id}`);
        
        if (!companyField || !positionField || !dateField || !statusField) return;

        const newCompany = companyField.value.trim();
        const newPosition = positionField.value.trim();
        const newDate = dateField.value;
        const newStatus = statusField.value;

        if (!newCompany || !newPosition) {
          showToast('Company and position cannot be empty.');
          return;
        }

        const appIndex = applications.findIndex(app => app.id === id);
        if (appIndex !== -1) {
          applications[appIndex] = {
            ...applications[appIndex],
            company: newCompany,
            position: newPosition,
            date: newDate || applications[appIndex].date,
            status: newStatus
          };
          saveToStorage();
        }
        
        editId = null;
        renderTable();
        showToast('Application updated.');
        return;
      }

      // CANCEL button (inside edit mode)
      if (target.classList.contains('cancel-btn')) {
        e.preventDefault();
        editId = null;
        renderTable();
        return;
      }
    }

    // filter change
    function handleFilterChange() {
      // if editing, cancel edit to avoid confusion
      if (editId) {
        editId = null;
      }
      renderTable();
    }

    // ---------- initialization ----------
    function init() {
      loadFromStorage();
      
      // set default date for date input to today
      const today = new Date().toISOString().slice(0,10);
      if (dateInput) dateInput.value = today;
      
      // initial render
      renderTable();
      
      // event listeners
      addBtn.addEventListener('click', handleAddApplication);
      
      // allow Enter key in company/position to trigger add
      [companyInput, positionInput].forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleAddApplication();
          }
        });
      });

      // table body event delegation
      tableBody.addEventListener('click', handleTableClick);

      // filter change
      statusFilter.addEventListener('change', handleFilterChange);
    }

    // start the app
    init();
  })();
</script>
</body>
</html>
